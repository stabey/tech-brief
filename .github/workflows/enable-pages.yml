name: Enable GitHub Pages

on:
  push:
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions:
  pages: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create or update Pages site from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          set +e
          gh api -X POST repos/stabey/tech-brief/pages \
            -f build_type=legacy \
            -f "source[branch]=main" \
            -f "source[path]=/"
          post_status=$?
          set -e
          if [ "$post_status" -ne 0 ]; then
            gh api -X PUT repos/stabey/tech-brief/pages \
              -f build_type=legacy \
              -f "source[branch]=main" \
              -f "source[path]=/"
          fi
          gh api repos/stabey/tech-brief/pages
