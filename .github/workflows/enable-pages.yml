name: Enable GitHub Pages

on:
  push:
    paths:
      - .github/workflows/enable-pages.yml
  workflow_dispatch:

permissions: write-all

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Create Pages site from main /
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          curl -sS -D /tmp/pages.headers -o /tmp/pages.body \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            -H "Content-Type: application/json" \
            -d '{"build_type":"legacy","source":{"branch":"main","path":"/"}}' \
            https://api.github.com/repos/stabey/tech-brief/pages
          echo "POST status line:"
          head -n 1 /tmp/pages.headers
          echo "accepted permissions:"
          grep -i x-accepted-github-permissions /tmp/pages.headers || true
          echo "body:"
          cat /tmp/pages.body
          echo
          code=$(head -n 1 /tmp/pages.headers | awk '{print $2}')
          if [ "$code" != "201" ] && [ "$code" != "200" ] && [ "$code" != "204" ]; then
            exit 1
          fi
